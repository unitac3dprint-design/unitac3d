<style>.pfo{display:flex;flex-direction:column}
.pfo > .wrap{width:100%}
.pfo__hero{position:relative;overflow:hidden;background:radial-gradient(90% 120% at 15% 0%,rgba(255,122,60,.16),transparent 60%)}
.pfo__hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(var(--slant),rgba(255,255,255,.022) 0 2px,transparent 2px 14px)}
.pfo__heroin{position:relative;display:flex;flex-direction:column;gap:12px;padding-top:88px;padding-bottom:36px;max-width:1180px}
.pfo__heroin::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--rule-strong)}
.pfo__kick{font-family:var(--font-num);font-size:13px;letter-spacing:.38em;color:var(--accent)}
.pfo__heroin h1{font-size:64px;line-height:1.12}
.pfo__stats{font-family:var(--font-num);font-size:12.5px;letter-spacing:.05em;color:var(--muted)}
.pfo__stats b{color:var(--ink);font-weight:500}
@media (max-width:760px){.pfo__heroin{padding-top:52px;padding-bottom:24px}.pfo__heroin::after{left:16px;right:16px}.pfo__heroin h1{font-size:40px}.pfo__kick{font-size:11px}}
.pfo__body{max-width:1180px;padding-top:24px;padding-bottom:88px;display:flex;flex-direction:column;gap:28px}
.pfo__tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.pfo__tabs::-webkit-scrollbar{display:none}
.pfo__tabs button{flex:none;min-height:46px;padding:0 2px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-size:15px;font-weight:500;white-space:nowrap}
.pfo__tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.pfo__tabs button:hover{color:var(--ink)}
.pfo__tabs b{font-family:var(--font-num);font-weight:400;font-size:12px;margin-left:6px;opacity:.6}
@media (max-width:760px){.pfo__tabs{gap:20px;margin:0 -16px;padding:0 16px}.pfo__tabs button{font-size:14px}}
.pfo__grid{columns:3 300px;column-gap:16px}
.pw{position:relative;display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:none;break-inside:avoid;cursor:zoom-in;opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.16,1,.3,1) var(--d,0ms),transform .8s cubic-bezier(.16,1,.3,1) var(--d,0ms)}
.pw.in{opacity:1;transform:none}
.pw img{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5));transition:transform .7s cubic-bezier(.16,1,.3,1),filter .5s}
.pw:hover img,.pw:focus-visible img{transform:translateY(-4px) scale(1.02);filter:drop-shadow(0 22px 30px rgba(0,0,0,.6))}
.pw:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.pw{opacity:1;transform:none}}
@media (max-width:600px){.pfo__grid{columns:2 150px;column-gap:10px}.pw{margin-bottom:10px}}
.pempty{padding:40px 0;color:var(--muted)}
/* lightbox */
.lb{border:0;padding:0;margin:0;width:100vw;height:100dvh;max-width:none;max-height:none;background:rgba(10,9,8,.96);color:var(--ink)}
.lb::backdrop{background:rgba(10,9,8,.96)}
.lb__in{position:relative;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:20px}
.lb__fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;max-height:100%;min-height:0}
.lb__fig img{max-width:100%;max-height:calc(100dvh - 120px);object-fit:contain;box-shadow:0 30px 80px -30px rgba(0,0,0,.9);background:#0E0D0B;min-height:120px;min-width:120px}
.lb__fig figcaption{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;max-width:640px}
.lb__fig b{font-family:var(--font-head);font-size:19px;font-weight:600}
.lb__fig span{font-size:12.5px;color:var(--accent)}
.lb__fig p{font-size:14px;color:var(--ink-2);margin-top:4px}
.lb__x{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:2;background:rgba(29,27,24,.8)}
.lb__nav{width:48px;height:48px;background:rgba(29,27,24,.8)}
@media (max-width:600px){.lb__in{grid-template-columns:minmax(0,1fr);padding:56px 10px 16px}.lb__nav{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px))}.lb__prev{left:16px}.lb__next{right:16px}.lb__fig img{max-height:calc(100dvh - 220px)}}
dialog[open].lb .lb__fig img{animation:pop .35s var(--ease)}
</style>
