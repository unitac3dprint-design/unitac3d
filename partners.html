<style>.prt{padding-top:64px;padding-bottom:72px;max-width:1080px;display:flex;flex-direction:column;gap:44px}
.center{text-align:center}
.prt__hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.prt__kick{font-family:var(--font-num);font-size:12px;letter-spacing:.32em;color:var(--accent)}
.prt__hero h1{font-size:40px}
@media (max-width:600px){.prt{padding-top:40px;gap:30px}.prt__hero h1{font-size:28px}.prt__kick{font-size:11px}}
.prt__tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.prt__tabs::-webkit-scrollbar{display:none}
.prt__tabs button{flex:none;min-height:46px;padding:0 2px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-size:15px;font-weight:500;white-space:nowrap}
.prt__tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.prt__tabs button:hover{color:var(--ink)}
@media (max-width:600px){.prt__tabs{gap:20px;margin:0 -16px;padding:0 16px}.prt__tabs button{font-size:14px}}
.prt__secs{display:flex;flex-direction:column;gap:48px}
.psec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.psec__h{display:flex;flex-direction:column;gap:4px;position:sticky;top:24px}
.psec__n{font-family:var(--font-num);font-size:12px;letter-spacing:.2em;color:var(--accent)}
.psec__h h2{font-size:20px}
.psec__en{font-family:var(--font-num);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
@media (max-width:760px){
  .psec{grid-template-columns:minmax(0,1fr);gap:14px}
  .psec__h{position:static;flex-direction:row;align-items:baseline;gap:10px}
  .psec__h::after{content:'';flex:1;height:1px;background:var(--rule);align-self:center}
  .psec__en{display:none}
  .psec__h h2{font-size:18px}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
.prt__cta{text-align:center;font-size:14px;color:var(--muted)}
.prt__cta a{text-decoration:none;border-bottom:1px solid var(--accent)}
.pempty{padding:40px 0;text-align:center;color:var(--muted)}
