<style>.center{text-align:center}
.prt{display:flex;flex-direction:column}
.prt > .wrap{width:100%}
/* editorial hero */
.prt__hero{position:relative;overflow:hidden;background:radial-gradient(90% 120% at 15% 0%,rgba(255,122,60,.16),transparent 60%)}
.prt__hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(var(--slant),rgba(255,255,255,.022) 0 2px,transparent 2px 14px)}
.prt__mark{position:absolute;right:-6%;top:50%;width:min(860px,110vw);transform:translateY(-48%);color:#F2EDE5;opacity:.04;pointer-events:none}
.prt__mark svg{width:100%;height:auto}
.prt__heroin{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-top:96px;padding-bottom:44px;max-width:1180px}
.prt__heroin::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--rule-strong)}
.prt__title{display:flex;flex-direction:column;gap:12px}
.prt__kick{font-family:var(--font-num);font-size:13px;letter-spacing:.38em;color:var(--accent)}
.prt__title h1{font-size:64px;line-height:1.12}
.prt__side{max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:right}
.prt__lead{font-size:15.5px;color:var(--ink-2);line-height:1.75}
.prt__stats{font-family:var(--font-num);font-size:12.5px;letter-spacing:.05em;color:var(--muted);line-height:1.8}
.prt__stats b{color:var(--ink);font-weight:500}
@media (max-width:760px){
  .prt__heroin{flex-direction:column;align-items:flex-start;gap:16px;padding-top:56px;padding-bottom:28px}
  .prt__heroin::after{left:16px;right:16px}
  .prt__title h1{font-size:40px}.prt__kick{font-size:11px}
  .prt__side{text-align:left;max-width:none}
  .prt__mark{right:-30%;opacity:.035}
}
/* category rows */
.prt__body{max-width:1180px;padding-bottom:88px}
.prt__rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:center;padding:44px 0;border-bottom:1px solid var(--rule)}
.prow__h{display:flex;align-items:baseline;gap:18px;align-self:start;padding-top:28px}
.prow__n{font-family:var(--font-num);font-size:52px;font-weight:500;line-height:1;color:var(--rule-strong)}
.prow__t{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow__t h2{font-size:24px;line-height:1.35}
.prow__en{font-family:var(--font-num);font-size:11px;letter-spacing:.16em;color:var(--muted)}
.prow__logos{display:flex;flex-wrap:wrap;gap:20px 28px}
.prow__logos .ptile{width:200px}
@media (max-width:760px){
  .prow{grid-template-columns:minmax(0,1fr);gap:18px;padding:32px 0}
  .prow__h{padding-top:0;gap:14px}
  .prow__n{font-size:38px}
  .prow__t h2{font-size:20px}
  .prow__logos{gap:20px 12px}
  .prow__logos .ptile{width:calc(50% - 6px)}
  .ptile__nm{font-size:14px}
}
.pempty{padding:48px 0;text-align:center;color:var(--muted)}
.prt__ctaw{padding-top:36px;padding-bottom:72px;max-width:1180px}
.prt__cta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:32px 36px;border-radius:22px;background:#F2EDE5;color:#141311}
.prt__cta h2{font-size:26px}
.prt__cta p{color:#4A473F;margin-top:4px}
.prt__cta .btn{min-height:50px;padding:0 26px}
@media (max-width:700px){.prt__cta{padding:24px}.prt__cta .btn{width:100%}}
.pinvite{width:200px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;border:1px dashed var(--rule-strong);color:var(--muted);text-decoration:none;font-size:13.5px;text-align:center;padding:12px;transition:border-color .3s var(--ease),color .3s var(--ease)}
.pinvite b{font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--ink-2)}
.prow--empty .prow__n{color:var(--rule)}
@media (max-width:760px){.pinvite{width:100%;aspect-ratio:auto;min-height:96px}}

/* scroll motion: logos glide in from the right, rows drift with the scroll (parallax) */
.prt-anim .prow__logos{transform:translate3d(var(--px,0px),0,0);will-change:transform}
.prt-anim .prow__n{transform:translate3d(0,var(--py,0px),0);will-change:transform}
.prt-anim .prt__mark{transform:translate3d(0,calc(-48% + var(--hy,0px)),0)}
.prt-anim .prow__t{opacity:0;transform:translate3d(24px,0,0);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}
.prt-anim .prow.is-in .prow__t{opacity:1;transform:none}
.prt-anim .prow .ptile,.prt-anim .prow .pinvite{opacity:0;transform:translate3d(90px,0,0);filter:blur(4px);transition:opacity .9s cubic-bezier(.16,1,.3,1) var(--d,0ms),transform 1.2s cubic-bezier(.16,1,.3,1) var(--d,0ms),filter .9s cubic-bezier(.16,1,.3,1) var(--d,0ms)}
.prt-anim .prow.is-in .ptile,.prt-anim .prow.is-in .pinvite{opacity:1;transform:none;filter:none}
@media (max-width:760px){.prt-anim .prow .ptile,.prt-anim .prow .pinvite{transform:translate3d(48px,0,0)}}
@media (prefers-reduced-motion: reduce){.prt-anim .prow__logos,.prt-anim .prow__n,.prt-anim .prt__mark{transform:none!important}}
</style>
