<style>.trk{padding-top:36px;padding-bottom:56px;display:flex;flex-direction:column;gap:18px}
.trk__head{display:flex;flex-direction:column;gap:4px}
.trk__kick{font-family:var(--font-num);font-size:11.5px;letter-spacing:.24em;color:var(--accent)}
.trk__head h1{font-size:28px;line-height:1.3}
.trk__job{font-size:14px;color:var(--ink-2)}
.trk__card{display:flex;flex-direction:column;gap:18px;padding:20px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--rule)}
.trk__num{display:flex;flex-direction:column;gap:4px}
.trk__numrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trk__numrow b{font-size:22px;font-weight:500;letter-spacing:.05em;overflow-wrap:anywhere}
.trk__copy{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule-strong);color:var(--ink-2);display:grid;place-items:center;flex:none}
.trk__copy:hover{color:var(--ink);border-color:var(--ink-2)}
.trk__copy svg{width:16px;height:16px}
.trk__now{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--accent-soft)}
.trk__now.is-ok{background:var(--ok-soft)}
.trk__now.is-bad{background:var(--stop-soft)}
.trk__now.is-wait{background:var(--sunk)}
.trk__nowic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--on-accent)}
.is-ok .trk__nowic{background:var(--ok);color:#10241A}
.is-bad .trk__nowic{background:var(--stop);color:#2A0F0D}
.is-wait .trk__nowic{background:var(--rule-strong);color:var(--ink)}
.trk__nowic svg{width:21px;height:21px}
.trk__now b{display:block;font-weight:600;color:var(--accent-hi);line-height:1.4}
.is-ok .trk__now b,.trk__now.is-ok b{color:var(--ok)}
.trk__now.is-bad b{color:var(--stop)}
.trk__now.is-wait b{color:var(--ink)}
.trk__now span{font-size:12.5px;color:var(--ink-2)}
.trk__tl{list-style:none;margin:0;padding:4px 0 0}
.tli{position:relative;display:flex;gap:14px;padding-bottom:18px}
.tli:last-child{padding-bottom:0}
.tli::before{content:'';position:absolute;left:12px;top:30px;bottom:-4px;width:2px;background:var(--rule-strong)}
.tli:last-child::before{display:none}
.tli__dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok);color:#10241A}
.tli__dot svg{width:14px;height:14px}
.tli--now .tli__dot{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 6px rgba(255,122,60,.18)}
.tli--bad .tli__dot{background:var(--stop);color:#2A0F0D}
.tli--wait .tli__dot{background:none;border:2px solid var(--rule-strong)}
.tli__t{display:flex;flex-direction:column;gap:2px;padding-top:2px;min-width:0}
.tli__t b{font-size:14.5px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.tli--now .tli__t b{font-weight:600}
.tli--wait .tli__t b{color:var(--muted)}
.tli__t span{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.trk__go{gap:8px}
.trk__go svg{width:16px;height:16px}
.trk__form{display:flex;gap:10px;align-items:flex-end;margin-top:8px}
.trk__form .field{flex:1}
.trk__form input{font-family:var(--font-num);letter-spacing:.05em;text-transform:uppercase}
.tli__t em{font-style:normal;font-size:13px;color:var(--ink-2);line-height:1.55;overflow-wrap:anywhere}
</style>
